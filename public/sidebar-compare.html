<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sidebar shades — compare</title>

<style>
  body { margin: 0; font-family: Geist, Inter, system-ui, sans-serif; background: #f4f4f5; color: #18181b; }
  header { padding: 14px 20px; border-bottom: 1px solid #e4e4e7; background: #fff; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }

  header p { margin: 0; font-size: 13px; color: #52525b; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 14px 20px; height: calc(100vh - 80px); box-sizing: border-box; }
  figure { margin: 0; display: flex; flex-direction: column; border: 1px solid #e4e4e7; border-radius: 8px; overflow: hidden; background: #fff; min-height: 0; }
  figcaption { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #e4e4e7; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  figcaption strong { font-size: 14px; }
  figcaption a { font-size: 12.5px; color: #5945e8; }
  iframe { border: 0; width: 100%; flex: 1; min-height: 0; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; height: auto; } iframe { height: 70vh; } }
</style></head>
<body>
<header><h1>Sidebar shades</h1><p>Same favicon hue, three depths. Click a title to open that one full size — the choice is remembered.</p></header>
